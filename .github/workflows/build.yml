name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe
        run: python -m py_compile agenda_de_contatos.py

      - name: Teste rápido (abrir e desligar)
        run: printf '7\n' | python agenda_de_contatos.py | grep "Desligando sistema"
